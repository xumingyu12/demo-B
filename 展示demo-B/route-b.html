<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>岐黄智谱 · 本地分子结构管线（路线 B）</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="route-b.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="seal">岐</div>
    <div class="brand-text">
      <h1>岐黄智谱 <span class="sep">·</span> 本地分子结构管线</h1>
      <p>路线 B：RDKit 本地解析 · 标准化 · 2D 描绘 · 3D 构象 · 全程不联网</p>
    </div>
  </div>
  <div class="topmeta">
    <div class="metric"><b id="statCount">—</b><span>成分</span></div>
    <div class="metric"><b id="stat3d">—</b><span>3D 覆盖</span></div>
    <div class="metric"><b id="statTime">—</b><span>总耗时</span></div>
  </div>
</header>

<section class="toolbar">
  <div class="search">
    <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M10.5 3a7.5 7.5 0 1 0 4.55 13.46l4.24 4.24 1.42-1.42-4.24-4.24A7.5 7.5 0 0 0 10.5 3zm0 2a5.5 5.5 0 1 1 0 11 5.5 5.5 0 0 1 0-11z" fill="currentColor"/></svg>
    <input id="q" type="search" placeholder="搜索成分 / 英文名 / 分子式 / CID" autocomplete="off">
  </div>
  <div class="chips" id="chips"></div>
  <div class="segmented" id="mode" role="group" aria-label="视图模式">
    <button data-mode="both" class="on">双联</button>
    <button data-mode="2d">仅 2D</button>
    <button data-mode="3d">仅 3D</button>
  </div>
</section>

<main>
  <aside class="sidebar">
    <div class="compare" id="compare"></div>
    <div class="list" id="list"></div>
    <div class="empty" id="empty" hidden>没有匹配的成分</div>
  </aside>
  <section class="detail" id="detail"></section>
</main>

<footer class="foot">
  <span id="engine">RDKit —</span>
  <span class="warn">结构由本地算法生成 · 3D 为计算构象，非实验测定 · 仅用于科研原型演示</span>
</footer>

<script src="vendor/3Dmol-min.js"></script>
<script src="local.js"></script>
<script src="route-b.js"></script>
</body>
</html>
